paths:
  obs_pkl: null        # populated by preprocessing (inherited from ne128 preprocess_dir)
  gp_proj_pkl: null    # set after training
  output_dir: /home/rebassoo/work/MFAutotune_backup_2026-07-21/home_work/results_mf_ne128_ne32_prod_aurora_allparams_40starts_laplace
  preprocess_dir: /home/rebassoo/work/MFAutotune_backup_2026-07-21/home_work/preprocess_output_ne128_prod

multi_fidelity:
  low_fidelity_dir: /home/rebassoo/work/MFAutotune_backup_2026-07-21/home_work/preprocess_output_ne32_prod

data:
  n_zonal: 18
  regions_list:
    - poles
    - extratropical_land
    - extratropical_ocean
    - tropical_land
    - ascending_tropical_ocean
    - descending_tropical_ocean
  variables: [PCP, OSR, OLR, TLWP]

weights:
  variables:
    PCP: 0.3
    OSR: 0.1   # reduced from 0.25 per request — reduces OSR's contribution to the cost
    OLR: 0.3
    TLWP: 0.3
  zrg:
    zonal: 0.3333333333
    regional: 0.3333333333
    global: 0.3333333333
  dy:
    ANN: 1.0
  zonal_weights: null
  regional_weights: null

optimize:
  seed: 50
  n_xstarts: 5
  niter: 1
  method: L-BFGS-B
  bounds:
    low: 0.0
    high: 1.0
  n_params: 19
  # Restrict the search to the range the PPE actually sampled; the declared
  # param_physical_bounds are much wider than the design for several params.
  bounds_from_data: true
  # GPy is not thread-safe (kernel slice state lives on the shared model
  # object), so starts are parallelised across forked processes instead.
  executor: process
  max_workers: 32
  # Laplace NLL using the GP's own predictive variance as the scale term --
  # the likelihood-based counterpart to plain 'mae': L1 (absolute-error)
  # residual growth like MAE, but heteroscedasticity-aware (weighted by v_c
  # and including the proper log(2*v_c) normalization), the same property
  # gaussian_gp_variance/student_t have. See
  # autotune_gp.cost.zrg_cost_function_laplace. Same seed=50 x0s as the
  # dof=4 Student-t and plain-MAE MF baselines for direct comparability.
  likelihood: laplace_gp_variance
  var_floor: 1.0e-6
  variance_penalty_kappa: 0.0
  training_distance_penalty_lambda: 0.0
  param_ordering_constraints:
    - [lambda_low, lambda_high]
  param_physical_bounds:
    thl2tune:                              [0.1, 10]
    qw2tune:                               [0.1, 10]
    length_fac:                            [0.1, 10]
    c_diag_3rd_mom:                        [0.01, 10]
    coeff_kh:                              [0.01, 1]
    coeff_km:                              [0.01, 1]
    lambda_low:                            [0.0001, 0.1]
    lambda_high:                           [0.0001, 0.1]
    spa_ccn_to_nc_factor:                  [100, 5000]
    cldliq_to_ice_collection_factor:       [0.1, 1]
    rain_to_ice_collection_factor:         [0.1, 1]
    accretion_prefactor:                   [0.01, 100]
    deposition_nucleation_exponent:        [0.2, 0.304]
    max_total_ni:                          [500000, 10000000]
    ice_sedimentation_factor:              [0.1, 2]
    rain_selfcollection_breakup_diameter:  [0, 0.0005]
    autoconversion_prefactor:              [10, 20000]
    autoconversion_qc_exponent:            [2, 4]
    autoconversion_radius:                 [2.0e-05, 5.0e-05]

runtime:
  train_gp: true
  backend: numpy
  device: cpu
  tf_determinism: false

diagnostics:
  enabled: true
  output_dir: null
  # Post-hoc parameter-uncertainty report (inverse-Hessian covariance at the
  # best-found point) -- meaningful for laplace_gp_variance, though expect
  # NaN/unstable stderr for individual parameters whose main influence is on
  # a location where the residual sits very close to zero at the optimum
  # (the |r| kink), unlike gaussian_gp_variance/student_t.
  report_uncertainty: true

# ---- Preprocessing inputs ----
# HF (ne128) and LF (ne32) data are preprocessed separately using their own
# Perlmutter configs before running MF stage 2; preprocess_dir above already
# contains all pkl files copied over from that NERSC preprocessing run, so
# stage 2 does not need any of the fields below.
#
# control_file / regions_file still point at NERSC scratch paths and are NOT
# reachable from Aurora. They only matter for `--stage 1 --preprocess-mode
# ppe`, which cannot be (re)run here. The obs_files below have been updated
# to local Aurora paths since obs.pkl can still be rebuilt from them with
# `--stage 1 --preprocess-mode obs` if ever needed.
preprocess:
  params_json: /home/rebassoo/work/MFAutotune_backup_2026-07-21/home_work/normranked_ne128_prod.json
  control_file: /pscratch/sd/b/beydoun/e3sm_scratch/pm-gpu/ne32_ppe_prod/PPEensemble_1node_full1024.ne32pg2_ne32pg2.F2010-SCREAMv1.20260515.m000/run/1ma_ne32pg2.AVERAGE.nmonths_x1.2019-08-01-00000.nc
  regions_file: /global/cfs/cdirs/e3sm/beydoun/autotune_utils/1ma_ne32pg2.AVERAGE.201909_202009.mean.omega500_masks.nc

  drop_zonal_bands: [-85, -75, 85]

  snapshots:
    - label: ANN
      weight: 1.0
      sim_dir: null
      obs_dir: null
      nc_glob: null
      min_files: 1

  variables:
    PCP:
      sim_field: precip_total_surf_mass_flux
      sim_components: [precip_liq_surf_mass_flux, precip_ice_surf_mass_flux]
      obs_files:
        ANN: /home/rebassoo/work/MFAutotune_backup_2026-07-21/home_work/PRECT_IMERG_ne32pg2_201908_202007.nc
      obs_nc_var: PRECT
      obs_scale: 1.0
    OSR:
      sim_field: SW_flux_up_at_model_top
      obs_files:
        ANN: /home/rebassoo/work/MFAutotune_backup_2026-07-21/home_work/CERES_EBAF_ne32pg2_201908_202007.nc
      obs_nc_var: toa_sw_all_mon
      obs_scale: 1.0
    OLR:
      sim_field: LW_flux_up_at_model_top
      obs_files:
        ANN: /home/rebassoo/work/MFAutotune_backup_2026-07-21/home_work/CERES_EBAF_ne32pg2_201908_202007.nc
      obs_nc_var: toa_lw_all_mon
      obs_scale: 1.0
    TLWP:
      sim_field: LiqWaterPath
      sim_components: [LiqWaterPath, RainWaterPath]
      obs_files:
        ANN: /home/rebassoo/work/MFAutotune_backup_2026-07-21/home_work/TLWP_MACLWP_ne32pg2_201908_202007.nc
      obs_nc_var: totallwp
      obs_scale: 0.001   # g/m² → kg/m²
